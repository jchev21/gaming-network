name: XYZ Discord Branding Safety
on:
  pull_request:
    paths:
      - 'discord-bot/**'
      - '.github/workflows/xyz-discord-branding-ci.yml'
  push:
    paths:
      - 'discord-bot/**'
      - '.github/workflows/xyz-discord-branding-ci.yml'
jobs:
  brand-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aiohttp
      - name: Test icon decoding, one-shot flags, and guild pin
        run: python -m unittest test_xyz_brand_icons
      - name: Compile bot source
        run: python -m py_compile bot.py xyz_brand_icons.py
