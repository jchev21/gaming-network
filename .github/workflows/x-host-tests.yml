name: X Host Workflow Tests
on:
  push:
    branches:
      - feature/x-host-workflow
  pull_request:
    paths:
      - 'x-integration/**'
      - '.github/workflows/x-host-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: x-integration
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test game core, private host instructions, X auth and lobby API
        run: npm test
