name: Discord change-bridge CI
on:
  push:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-change-bridge-ci.yml"
  pull_request:
    paths:
      - "discord-bot/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile change-bridge package
        run: python -m compileall -q discord_bot_change_bridge change_commands.py owner_api.py
      - name: Schema / auth / publish / bulk tests
        run: |
          python -m unittest tests.test_change_bridge tests.test_batch_a_commands \
            tests.test_batch_b_publish tests.test_batches_c_h tests.test_async_apply_replay_guard -v
      - name: Existing bot offline tests
        run: |
          python -m unittest test_xyz_brand_icons test_community_onboarding \
            test_dashboard_refresh test_native_hub_feeds -v
      - name: bot.py registration hooks present
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path("bot.py").read_text()
          assert "register_change_commands" in t, "missing change-bridge registration"
          print("bot.py hooks OK")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build discord-bot image
        run: docker build -t gn-discord-bot:ci ./discord-bot
