name: Discord change-bridge CI
on:
  push:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-change-bridge-ci.yml"
  pull_request:
    paths:
      - "discord-bot/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile packages
        run: python -m compileall -q discord_bot_change_bridge change_commands.py onboarding_roles.py owner_api.py member_grant_api.py member_grant_wire.py
      - name: Schema / auth / publish / bulk / member-grant tests
        run: |
          python -m unittest tests.test_change_bridge tests.test_batch_a_commands \
            tests.test_batch_b_publish tests.test_batches_c_h tests.test_async_apply_replay_guard \
            tests.test_change_owner_permissions tests.test_read_only_preflight \
            tests.test_overhaul_onboarding tests.test_member_grant_api -v
      - name: Existing bot offline tests
        run: |
          python -m unittest test_xyz_brand_icons test_community_onboarding \
            test_dashboard_refresh test_native_hub_feeds -v
      - name: Apply and verify Member-grant start_web wire
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("bot.py")
          t = p.read_text()
          assert "register_change_commands" in t, "missing change-bridge registration"
          if "attach_member_grant" not in t:
              old = 'async def start_web():\n    app = web.Application()\n    app.router.add_get("/", index)'
              new = '''async def start_web():\n    app = web.Application()\n    # Issue #78 Member grant S2S (disabled unless GN_MEMBER_GRANT_ENABLED=true).\n    try:\n        from member_grant_wire import attach_member_grant\n        attach_member_grant(app, bot, DATA_DIR)\n        print("Member grant route registered (enabled only if GN_MEMBER_GRANT_ENABLED=true)")\n    except Exception as exc:\n        print("Member grant wire skipped:", type(exc).__name__)\n    app.router.add_get("/", index)'''
              assert old in t, "start_web anchor missing"
              p.write_text(t.replace(old, new, 1))
              t = p.read_text()
          assert "attach_member_grant" in t
          import ast
          ast.parse(t)
          print("bot.py hooks OK")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build discord-bot image
        run: docker build -t gn-discord-bot:ci ./discord-bot
