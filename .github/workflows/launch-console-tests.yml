name: Offline Launch Acceptance Console Tests

on:
  pull_request:
    paths:
      - 'tools/launch-acceptance-console/**'
      - '.github/workflows/launch-console-tests.yml'
  push:
    branches:
      - review/perplexity-in-person-launch-console-1105
    paths:
      - 'tools/launch-acceptance-console/**'
      - '.github/workflows/launch-console-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline acceptance-console self-tests
        run: node tools/launch-acceptance-console/test-console.mjs
      - name: Package self-contained offline human acceptance console
        run: |
          set -euo pipefail
          cd tools/launch-acceptance-console
          for f in index.html styles.css checklist-data.js console-core.js app.js HANDOFF.md MANIFEST.md; do
            test -s "$f"
          done
          zip -q -j "$RUNNER_TEMP/gaming-network-in-person-acceptance-console.zip" \
            index.html styles.css checklist-data.js console-core.js app.js HANDOFF.md MANIFEST.md
          unzip -l "$RUNNER_TEMP/gaming-network-in-person-acceptance-console.zip"
      - name: Upload private offline launch-console ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gaming-network-in-person-acceptance-console
          path: ${{ runner.temp }}/gaming-network-in-person-acceptance-console.zip
          if-no-files-found: error
          retention-days: 14
