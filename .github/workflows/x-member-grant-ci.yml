name: X and Discord Member-grant protocol CI
on:
  pull_request:
    paths:
      - "x-integration/member-grant-*.mjs"
      - "x-integration/member-link-acceptance.test.mjs"
      - "x-integration/discord-member-link.mjs"
      - ".github/workflows/x-member-grant-ci.yml"
  push:
    paths:
      - "x-integration/member-grant-*.mjs"
      - "x-integration/member-link-acceptance.test.mjs"
      - "x-integration/discord-member-link.mjs"
jobs:
  offline-member-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check exact JS syntax
        run: |
          node --check member-grant-client.mjs
          node --check member-grant-client.test.mjs
          node --check discord-member-link.mjs
          node --check member-link-acceptance.test.mjs
      - name: HMAC + OAuth offline denial and happy-path tests
        run: |
          node member-grant-client.test.mjs
          node member-link-acceptance.test.mjs
